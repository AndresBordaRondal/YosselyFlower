<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor Amarilla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, #1a2a3a 0%, #0d131a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        svg {
            width: 380px;
            height: 480px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25));
        }

        .draw-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .stem {
            stroke: #2e7d32;
            stroke-width: 8;
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: draw 2s ease-in-out forwards;
        }

        .leaf {
            fill: #388e3c;
            stroke: #1b5e20;
            stroke-width: 2;
            opacity: 0;
            transform-origin: center;
            animation: growLeaf 1.5s ease-out forwards;
        }

        .leaf-left {
            animation-delay: 1.5s;
        }

        .leaf-right {
            animation-delay: 2s;
        }

        .petal {
            fill: rgba(255, 223, 0, 0.92);
            stroke: #fbc02d;
            stroke-width: 2.5;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            opacity: 0;
            animation: drawPetal 0.8s ease-out forwards;
        }

        .center-bg {
            fill: #ff8f00;
            stroke: #e65100;
            stroke-width: 3;
            transform-origin: 200px 170px;
            transform: scale(0);
            animation: popCenter 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: 2.8s;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes growLeaf {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes popCenter {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes drawPetal {
            0% {
                stroke-dashoffset: 300;
                opacity: 0;
            }
            50% {
                stroke-dashoffset: 0;
                opacity: 0.8;
            }
            100% {
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }

        .title {
            margin-top: 20px;
            color: #ffe082;
            font-size: 1.5rem;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 2s forwards;
            animation-delay: 5.8s;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .btn-replay {
            margin-top: 15px;
            padding: 8px 18px;
            background: transparent;
            border: 2px solid #ffe082;
            color: #ffe082;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 1.5s forwards;
            animation-delay: 6.3s;
        }

        .btn-replay:hover {
            background: #ffe082;
            color: #1a2a3a;
            box-shadow: 0 0 15px rgba(255, 224, 130, 0.6);
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <svg viewBox="0 0 400 500">
            <path class="draw-line stem" d="M 200 450 Q 190 320 200 170" />
            <path class="leaf leaf-left" d="M 195 340 Q 130 310 120 350 Q 160 380 195 340 Z" />
            <path class="leaf leaf-right" d="M 203 290 Q 270 260 280 300 Q 240 330 203 290 Z" />
            <g id="petalsGroup"></g>
            <circle class="center-bg" cx="200" cy="170" r="32" />
        </svg>

        <div class="title">Tu flor amarilla Yossely</div>
        <button class="btn-replay" id="replayBtn">Ver de nuevo</button>
    </div>

    <script>
        const numPetals = 12;
        const centerX = 200;
        const centerY = 170;

        function renderPetals() {
            const petalsGroup = document.getElementById('petalsGroup');
            if (!petalsGroup) return;
            
            petalsGroup.innerHTML = '';
            
            for (let i = 0; i < numPetals; i++) {
                const angle = (360 / numPetals) * i;
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                
                const d = `M ${centerX} ${centerY} 
                           C ${centerX - 25} ${centerY - 50}, ${centerX - 35} ${centerY - 110}, ${centerX} ${centerY - 120} 
                           C ${centerX + 35} ${centerY - 110}, ${centerX + 25} ${centerY - 50}, ${centerX} ${centerY}`;
                
                path.setAttribute("d", d);
                path.setAttribute("class", "petal");
                path.setAttribute("transform", `rotate(${angle}, ${centerX}, ${centerY})`);
                
                const delay = 3.2 + (i * 0.18);
                path.style.animationDelay = `${delay}s`;

                petalsGroup.appendChild(path);
            }
        }

        function setupReplay() {
            const btn = document.getElementById('replayBtn');
            if (btn) {
                btn.addEventListener('click', () => {
                    const container = document.getElementById('mainContainer');
                    const newContainer = container.cloneNode(true);
                    container.parentNode.replaceChild(newContainer, container);
                    
                    renderPetals();
                    setupReplay();
                });
            }
        }

        renderPetals();
        setupReplay();
    </script>
</body>
</html>
